name: Weekly RRG Chart Update

on:
  schedule:
    - cron: "0 12 * * 5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-rrg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance pandas numpy plotly

      - name: Run RRG script
        run: python rrg_chart.py

      - name: Commit updated chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --quiet --cached || git commit -m "Weekly auto-update RRG chart $(date -u +'%Y-%m-%d')"
          git push
